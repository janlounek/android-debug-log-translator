<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Debug Log Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 24px 32px;
            border-bottom: 2px solid #0f3460;
        }

        header h1 {
            font-size: 1.5rem;
            color: #a8d8ea;
        }

        header p {
            color: #7a7a9e;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Upload area */
        .upload-area {
            border: 2px dashed #0f3460;
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #16213e;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #a8d8ea;
            background: #1a2744;
        }

        .upload-area h2 {
            color: #a8d8ea;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .upload-area p {
            color: #7a7a9e;
            font-size: 0.9rem;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        /* Paste area */
        .paste-section {
            margin-top: 20px;
        }

        .paste-section label {
            display: block;
            color: #a8d8ea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .paste-section textarea {
            width: 100%;
            height: 160px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            resize: vertical;
        }

        .paste-section textarea:focus {
            outline: none;
            border-color: #a8d8ea;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 28px;
            background: #0f3460;
            color: #a8d8ea;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1a4a8a;
        }

        .btn.btn-danger {
            background: #5a1a1a;
            color: #e8a0a0;
        }

        .btn.btn-danger:hover {
            background: #7a2020;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Saved logs section */
        .saved-logs {
            margin-top: 28px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 20px;
        }

        .saved-logs h2 {
            color: #a8d8ea;
            font-size: 1.1rem;
            margin-bottom: 14px;
        }

        .saved-log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .saved-log-item:hover {
            background: #1a2744;
        }

        .saved-log-info {
            flex: 1;
        }

        .saved-log-name {
            font-weight: 600;
            color: #a8d8ea;
        }

        .saved-log-meta {
            font-size: 0.8rem;
            color: #7a7a9e;
            margin-top: 2px;
        }

        .saved-log-actions {
            display: flex;
            gap: 6px;
        }

        .saved-log-actions button {
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-top: 0;
        }

        .saved-logs-empty {
            color: #7a7a9e;
            font-size: 0.9rem;
        }

        /* Results */
        .results {
            margin-top: 32px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .results-header h2 {
            color: #a8d8ea;
            font-size: 1.2rem;
        }

        .badge {
            background: #0f3460;
            color: #a8d8ea;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .event-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .event-card-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .event-card-header.track-state {
            background: #0f3460;
        }

        .event-card-header.track-action {
            background: #3b2f0f;
        }

        .event-name {
            font-weight: 700;
            font-size: 1rem;
            color: #a8d8ea;
            word-break: break-all;
        }

        .event-type-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-type-badge.state {
            background: #1a4a8a;
            color: #a8d8ea;
        }

        .event-type-badge.action {
            background: #6b5a1f;
            color: #f0d060;
        }

        .event-timestamp {
            color: #7a7a9e;
            font-size: 0.85rem;
            font-family: 'Consolas', monospace;
        }

        .event-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .event-card-body {
            padding: 16px 20px;
        }

        .param-group {
            margin-bottom: 14px;
        }

        .param-group:last-child {
            margin-bottom: 0;
        }

        .param-group-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a7a9e;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .param-table {
            width: 100%;
            border-collapse: collapse;
        }

        .param-table tr:not(:last-child) td {
            border-bottom: 1px solid #0f3460;
        }

        .param-table td {
            padding: 6px 0;
            font-size: 0.9rem;
            vertical-align: top;
        }

        .param-key {
            color: #53a8b6;
            font-family: 'Consolas', monospace;
            white-space: nowrap;
            padding-right: 16px;
            width: 1%;
        }

        .param-value {
            color: #e0e0e0;
            font-family: 'Consolas', monospace;
            word-break: break-all;
        }

        .missing-params {
            background: #3b1515;
            border: 1px solid #7a2020;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 14px;
        }

        .missing-params-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #e05555;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .missing-params-list {
            list-style: none;
            padding: 0;
        }

        .missing-params-list li {
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #e8a0a0;
            padding: 2px 0;
        }

        .missing-params-list li::before {
            content: "- ";
            color: #e05555;
        }

        .event-card.has-errors {
            border-color: #7a2020;
        }

        .save-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .save-bar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .save-bar input[type="text"]:focus {
            outline: none;
            border-color: #a8d8ea;
        }

        .status-msg {
            font-size: 0.85rem;
            padding: 4px 0;
            min-height: 1.2em;
        }

        .status-msg.success { color: #5cb85c; }
        .status-msg.error { color: #e05555; }

        .no-results {
            text-align: center;
            color: #7a7a9e;
            padding: 40px;
            background: #16213e;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Android Debug Log Translator</h1>
        <p>Upload or paste Android debug logs to extract and format AnalyticsTracker events</p>
    </header>

    <div class="container">
        <!-- Saved logs from cloud -->
        <div class="saved-logs">
            <h2>Saved Logs</h2>
            <div id="savedLogList">
                <p class="saved-logs-empty">Loading...</p>
            </div>
        </div>

        <div class="upload-area" id="uploadArea" style="margin-top: 28px;">
            <h2>Drop your log file here</h2>
            <p>or click to browse (.txt)</p>
            <input type="file" id="fileInput" accept=".txt,.log">
        </div>

        <div class="paste-section">
            <label for="pasteInput">Or paste log text directly:</label>
            <textarea id="pasteInput" placeholder="Paste your Android debug log here..."></textarea>
            <button class="btn" id="parseBtn">Parse Logs</button>
        </div>

        <div class="results hidden" id="results">
            <div class="results-header">
                <h2>Analytics Events</h2>
                <span class="badge" id="eventCount"></span>
            </div>
            <div class="save-bar">
                <input type="text" id="fileName" placeholder="Enter a name for this log...">
                <button class="btn" id="saveCloudBtn">Save to Cloud</button>
                <button class="btn" id="saveFileBtn">Download .txt</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
            <div id="eventList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTzIQ-VQB2TQg5TPYfSjYdW7lab8BPy14",
            authDomain: "android-log-debugger.firebaseapp.com",
            projectId: "android-log-debugger",
            storageBucket: "android-log-debugger.firebasestorage.app",
            messagingSenderId: "340649945761",
            appId: "1:340649945761:web:10e11531571e72096b5ee0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const logsCollection = collection(db, 'saved_logs');

        // DOM elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const pasteInput = document.getElementById('pasteInput');
        const parseBtn = document.getElementById('parseBtn');
        const resultsEl = document.getElementById('results');
        const eventList = document.getElementById('eventList');
        const eventCountEl = document.getElementById('eventCount');
        const fileNameInput = document.getElementById('fileName');
        const saveCloudBtn = document.getElementById('saveCloudBtn');
        const saveFileBtn = document.getElementById('saveFileBtn');
        const statusMsg = document.getElementById('statusMsg');
        const savedLogList = document.getElementById('savedLogList');

        let lastParsedEvents = [];

        // ---- Firebase: Save to cloud ----
        saveCloudBtn.addEventListener('click', async () => {
            if (lastParsedEvents.length === 0) return;
            const name = fileNameInput.value.trim();
            if (!name) {
                showStatus('Please enter a name for this log.', 'error');
                return;
            }
            saveCloudBtn.disabled = true;
            saveCloudBtn.textContent = 'Saving...';
            try {
                await addDoc(logsCollection, {
                    name: name,
                    events: lastParsedEvents,
                    eventCount: lastParsedEvents.length,
                    createdAt: serverTimestamp()
                });
                showStatus('Saved to cloud!', 'success');
                loadSavedLogs();
            } catch (err) {
                showStatus('Failed to save: ' + err.message, 'error');
            } finally {
                saveCloudBtn.disabled = false;
                saveCloudBtn.textContent = 'Save to Cloud';
            }
        });

        // ---- Firebase: Load saved logs ----
        async function loadSavedLogs() {
            try {
                const q = query(logsCollection, orderBy('createdAt', 'desc'));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    savedLogList.innerHTML = '<p class="saved-logs-empty">No saved logs yet.</p>';
                    return;
                }

                savedLogList.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const date = data.createdAt ? data.createdAt.toDate().toLocaleString() : 'unknown';

                    const item = document.createElement('div');
                    item.className = 'saved-log-item';
                    item.innerHTML = `
                        <div class="saved-log-info">
                            <div class="saved-log-name">${escapeHtml(data.name)}</div>
                            <div class="saved-log-meta">${data.eventCount} event(s) &middot; ${escapeHtml(date)}</div>
                        </div>
                        <div class="saved-log-actions">
                            <button class="btn load-btn">Load</button>
                            <button class="btn btn-danger delete-btn">Delete</button>
                        </div>`;

                    item.querySelector('.load-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        lastParsedEvents = data.events;
                        fileNameInput.value = data.name;
                        renderEvents(data.events);
                    });

                    item.querySelector('.delete-btn').addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (!confirm(`Delete "${data.name}"?`)) return;
                        try {
                            await deleteDoc(doc(db, 'saved_logs', docSnap.id));
                            loadSavedLogs();
                        } catch (err) {
                            alert('Failed to delete: ' + err.message);
                        }
                    });

                    savedLogList.appendChild(item);
                });
            } catch (err) {
                savedLogList.innerHTML = `<p class="saved-logs-empty" style="color:#e05555">Failed to load saved logs: ${escapeHtml(err.message)}</p>`;
            }
        }

        // ---- Download .txt ----
        saveFileBtn.addEventListener('click', () => {
            if (lastParsedEvents.length === 0) return;
            const name = fileNameInput.value.trim() || 'analytics_log';
            const text = buildTextOutput(lastParsedEvents);
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name.endsWith('.txt') ? name : name + '.txt';
            a.click();
            URL.revokeObjectURL(a.href);
        });

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-msg ' + type;
            setTimeout(() => { statusMsg.textContent = ''; statusMsg.className = 'status-msg'; }, 4000);
        }

        function buildTextOutput(events) {
            const lines = [];
            lines.push(`Analytics Log - ${events.length} event(s)`);
            lines.push('='.repeat(70));

            for (let i = 0; i < events.length; i++) {
                const ev = events[i];
                const typeLabel = ev.trackType === 'state' ? 'State' : 'Action';
                const missing = getMissingParams(ev.params);

                lines.push('');
                lines.push(`[${i + 1}] ${typeLabel} - ${ev.eventName}`);
                lines.push(`    Timestamp: ${ev.timestamp}`);

                if (missing.length > 0) {
                    lines.push('');
                    lines.push(`    MISSING GLOBAL PARAMETERS (${missing.length}):`);
                    for (const p of missing) {
                        lines.push(`      - ${p}`);
                    }
                }

                if (ev.params.length > 0) {
                    lines.push('');
                    lines.push('    Parameters:');
                    const maxKey = Math.max(...ev.params.map(p => p.key.length));
                    for (const p of ev.params) {
                        lines.push(`      ${p.key.padEnd(maxKey)}  =  ${p.value}`);
                    }
                }

                lines.push('');
                lines.push('-'.repeat(70));
            }

            return lines.join('\n');
        }

        // ---- File upload ----
        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) readFile(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) readFile(e.dataTransfer.files[0]);
        });

        parseBtn.addEventListener('click', () => {
            const text = pasteInput.value.trim();
            if (text) processLogs(text);
        });

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                pasteInput.value = e.target.result;
                processLogs(e.target.result);
            };
            reader.readAsText(file);
        }

        // ---- Parsing ----
        function parseAnalyticsLine(line) {
            const eventMatch = line.match(/AnalyticsTracker\.(trackState|trackAction)\((?:event|action)=\s*([^,]+)/);
            if (!eventMatch) return null;

            const trackType = eventMatch[1] === 'trackState' ? 'state' : 'action';
            const eventName = eventMatch[2].trim();

            const tsMatch = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)/);
            const timestamp = tsMatch ? tsMatch[1] : 'unknown';

            const params = [];
            const paramRegex = /(csob\.[de]\.\w+)=([^,}]+)/g;
            let m;
            while ((m = paramRegex.exec(line)) !== null) {
                params.push({ key: m[1], value: m[2].trim() });
            }

            return { timestamp, eventName, trackType, params };
        }

        function buildParamTable(params) {
            let html = '<table class="param-table">';
            for (const p of params) {
                html += `<tr>
                    <td class="param-key">${escapeHtml(p.key)}</td>
                    <td class="param-value">${escapeHtml(p.value)}</td>
                </tr>`;
            }
            html += '</table>';
            return html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        const REQUIRED_GLOBAL_PARAMS = [
            'csob.d.user_scope',
            'csob.d.timestamp',
            'csob.d.client_type',
            'csob.d.cuid',
            'csob.d.application_version',
            'csob.d.device_id',
            'csob.d.environment',
            'csob.d.application',
            'csob.d.skin',
            'csob.d.screen_name',
            'csob.d.language',
        ];

        function getMissingParams(params) {
            const keys = new Set(params.map(p => p.key));
            return REQUIRED_GLOBAL_PARAMS.filter(rp => !keys.has(rp));
        }

        function processLogs(text) {
            const lines = text.split('\n');
            const analyticsLines = lines.filter(l => l.includes('AnalyticsTracker'));

            eventList.innerHTML = '';

            if (analyticsLines.length === 0) {
                resultsEl.classList.remove('hidden');
                eventCountEl.textContent = '0 events';
                eventList.innerHTML = '<div class="no-results">No AnalyticsTracker entries found in the log.</div>';
                return;
            }

            const events = analyticsLines.map(parseAnalyticsLine).filter(Boolean);
            lastParsedEvents = events;

            renderEvents(events);
        }

        function renderEvents(events) {
            resultsEl.classList.remove('hidden');
            eventCountEl.textContent = `${events.length} event${events.length !== 1 ? 's' : ''}`;
            eventList.innerHTML = '';

            for (let i = 0; i < events.length; i++) {
                const ev = events[i];
                const typeLabel = ev.trackType === 'state' ? 'State' : 'Action';
                const headerClass = ev.trackType === 'state' ? 'track-state' : 'track-action';
                const badgeClass = ev.trackType;

                const missing = getMissingParams(ev.params);
                const hasErrors = missing.length > 0;

                let bodyHtml = '';

                if (hasErrors) {
                    bodyHtml += `<div class="missing-params">
                        <div class="missing-params-title">Missing global parameters (${missing.length})</div>
                        <ul class="missing-params-list">
                            ${missing.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                        </ul>
                    </div>`;
                }

                if (ev.params.length > 0) {
                    bodyHtml += `<div class="param-group">
                        <div class="param-group-title">Parameters</div>
                        ${buildParamTable(ev.params)}
                    </div>`;
                }

                eventList.innerHTML += `
                    <div class="event-card${hasErrors ? ' has-errors' : ''}">
                        <div class="event-card-header ${headerClass}">
                            <div class="event-header-left">
                                <span class="event-type-badge ${badgeClass}">${typeLabel}</span>
                                <span class="event-name">${escapeHtml(ev.eventName)}</span>
                            </div>
                            <span class="event-timestamp">${escapeHtml(ev.timestamp)}</span>
                        </div>
                        <div class="event-card-body">
                            ${bodyHtml || '<p style="color:#7a7a9e">No parameters found.</p>'}
                        </div>
                    </div>`;
            }
        }

        // ---- Init: load saved logs on page load ----
        loadSavedLogs();
    </script>
</body>
</html>
